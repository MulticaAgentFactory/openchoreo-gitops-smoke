apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oc-gitops-smoke
  namespace: flux-system
spec:
  interval: 1m
  releaseName: oc-gitops-smoke
  targetNamespace: flux-smoke
  storageNamespace: flux-smoke
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: oc-gitops-smoke
        namespace: flux-system
      interval: 1m
  values:
    message: "v1"
